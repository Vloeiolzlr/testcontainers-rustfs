name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1" # every Monday, to notice when a new RustFS release breaks the module

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["rustfs/rustfs:1.0.1", "rustfs/rustfs:latest"]
        testcontainers: ["1.21.4", "2.0.5"] # Spring Boot 3 uses 1.x, Spring Boot 4 uses 2.x
    name: test (${{ matrix.image }}, TC ${{ matrix.testcontainers }})
    env:
      RUSTFS_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build -PtestcontainersTestVersion=${{ matrix.testcontainers }}
